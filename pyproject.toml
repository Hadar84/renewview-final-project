[project]
name = "renewview"
version = "0.1.0"
description = "RenewView — Multi-Agent AI System for Solar Energy Land Viability & Investment Decision Intelligence"
authors = [{ name = "Hadar Wigelman Zamoscinski" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.3",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "requests>=2.31",
    "streamlit>=1.30",
    "python-dotenv>=1.0",
    "overpy>=0.7",
    "joblib>=1.3",
    "folium>=0.15",
    "streamlit-folium>=0.18",
    "shapely>=2.0",
]

[project.scripts]
renewview = "renewview.main:main"
run_flow = "renewview.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
